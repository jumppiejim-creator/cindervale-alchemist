<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cindervale">
<meta name="description" content="A fantasy alchemy crafting RPG. Brew potions, enchant items, and build your workshop in Cindervale.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cindervale Alchemist</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; overflow-x: hidden; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="portraits.js"></script>
<script src="location-images.js?v=20261013a"></script>
<script src="game-data.js?v=20261013b"></script>
<script src="npc-portraits.js"></script>
<!-- The game itself: game.js, compiled from game.jsx by dev/build.js (which also updates this ?v=). -->
<script src="game.js?v=88200728a3"></script>
<script>
// index.html?src — try game.jsx edits before building: game.js stands down and game.jsx is compiled here in the
// browser (needs a local web server; same Babel settings as dev/build.js).
if(/[?&]src\b/.test(location.search))(function(){
  var b=document.createElement('script');b.src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js';
  b.onload=function(){fetch('game.jsx',{cache:'no-store'}).then(function(r){return r.text();}).then(function(src){
    var s=document.createElement('script');
    s.text='(function(){"use strict";'+Babel.transform(src,{filename:'game.jsx',sourceMaps:'inline',presets:['react',['env',{targets:{esmodules:true},modules:false}]],plugins:['transform-class-properties','transform-object-rest-spread','transform-flow-strip-types']}).code+'\n})();';
    document.body.appendChild(s);});};
  document.head.appendChild(b);
})();
</script>
<script>
// Register service worker for offline PWA support
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      console.log('[SW] Registered, scope:',reg.scope);
      // Check for updates periodically
      setInterval(()=>reg.update(),60*60*1000);
    }).catch(err=>console.warn('[SW] Registration failed:',err));
  });
}
</script>
</body>
</html>
